##############################################################
# WealthOS API — Nginx CORS Fix
# Run this on the server to fix browser login (preflight failure)
#
# SSH in, then run:
#   sudo cp /opt/wlthos/infra/nginx/wealthos-api-cors-fix.conf \
#            /etc/nginx/sites-available/wealthos-api
#   sudo nginx -t && sudo systemctl reload nginx
##############################################################

server {
    listen 80;
    server_name api.wlthos.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.wlthos.in;

    # ── SSL (adjust paths to your actual cert location) ──────
    ssl_certificate     /etc/letsencrypt/live/api.wlthos.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.wlthos.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── CORS — fix for browser preflight ─────────────────────
    # These three origins are always allowed. Add more if needed.
    set $cors_origin "";

    if ($http_origin = "https://wlthos.in") {
        set $cors_origin $http_origin;
    }
    if ($http_origin = "https://www.wlthos.in") {
        set $cors_origin $http_origin;
    }
    if ($http_origin = "http://localhost:3000") {
        set $cors_origin $http_origin;
    }
    if ($http_origin = "http://localhost:8000") {
        set $cors_origin $http_origin;
    }

    # Handle OPTIONS preflight for every route
    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      $cors_origin always;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age           86400 always;
            add_header Content-Length 0;
            add_header Content-Type  text/plain;
            return 204;
        }

        # Standard CORS headers on all non-OPTIONS responses
        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, X-Requested-With" always;
        add_header Access-Control-Allow-Credentials "true" always;

        # Proxy to FastAPI
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
